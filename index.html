    <!-- Resolves the saved appearance before first paint. Mirrors resolveAppearance in use-appearance.ts. -->
    <script>
      try {
        var savedAppearance = localStorage.getItem("shipit-appearance")
        var isDark =
          savedAppearance === "dark" ||
          (savedAppearance !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(isDark ? "dark" : "light")
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", isDark ? "#0e110f" : "#f4f6f2")
      } catch (error) {
        document.documentElement.classList.add("light")
      }
    </script>
